name: Build

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JORNADA_LLVM_RELEASE: v3
      JORNADA_TOOLS_REF: 0240d115c9db0506365796a1f7d941b842bbf5ff
      LLVM_NAME: velo-llvm-v3-linux-x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          path: jolt
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: Gadgetoid/jornada-72x-tools
          ref: ${{ env.JORNADA_TOOLS_REF }}
          path: jornada-72x-tools

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Download the Windows CE LLVM
        run: |
          url=https://github.com/Gadgetoid/velo-llvm-builds/releases/download/$JORNADA_LLVM_RELEASE
          curl -fsSLO $url/$LLVM_NAME.tar.xz
          curl -fsSLO $url/$LLVM_NAME.tar.xz.sha256
          shasum -a 256 -c $LLVM_NAME.tar.xz.sha256
          tar xf $LLVM_NAME.tar.xz -C "$RUNNER_TEMP"
          echo "JORNADA_LLVM_ROOT=$RUNNER_TEMP/$LLVM_NAME" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: jolt/build/deps/archives
          key: sources-${{ hashFiles('jolt/tools/fetch.sh') }}

      - name: Build and package
        working-directory: jolt
        run: JORNADA_TOOLS="$GITHUB_WORKSPACE/jornada-72x-tools" tools/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: jolt
          path: |
            jolt/build/dist/*.zip
            jolt/build/dist/*.tar.gz

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: jolt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" build/dist/*.zip build/dist/*.tar.gz --generate-notes "${prerelease[@]}"
