name: Build

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LLVM_RELEASE: v5
      GRIMACE_COMMIT: 6bde220126bef351b087b81ab8c897dc23490fb6
      LLVM_NAME: llvm-v5-linux-x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          path: jolt
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: grimace-sdk/grimace
          ref: ${{ env.GRIMACE_COMMIT }}
          path: grimace

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Download the Windows CE LLVM
        run: |
          url=https://github.com/grimace-sdk/llvm-builds/releases/download/$LLVM_RELEASE
          curl -fsSLO $url/$LLVM_NAME.tar.xz
          curl -fsSLO $url/$LLVM_NAME.tar.xz.sha256
          shasum -a 256 -c $LLVM_NAME.tar.xz.sha256
          tar xf $LLVM_NAME.tar.xz -C "$RUNNER_TEMP"
          echo "GRIMACE_LLVM_ROOT=$RUNNER_TEMP/$LLVM_NAME" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: jolt/build/deps/archives
          key: sources-${{ hashFiles('jolt/tools/fetch.sh') }}

      - name: Build and package
        working-directory: jolt
        run: GRIMACE="$GITHUB_WORKSPACE/grimace" tools/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: jolt
          path: |
            jolt/build/dist/*.zip
            jolt/build/dist/*.tar
            jolt/build/dist/*.tar.gz

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: jolt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" build/dist/*.zip build/dist/*.tar build/dist/*.tar.gz --generate-notes "${prerelease[@]}"
